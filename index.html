<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trampolin-Zähler</title>
<meta name="theme-color" content="#14213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sprünge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: eine Spalte wie ein Gerät — Zähler oben, Signal in der Mitte, Werte und Einstellungen darunter */
:root{
  --bg:#eef1f6; --surface:#ffffff; --fg:#14213a; --muted:#5b6880;
  --line:#d5dbe6; --accent:#ff7a1a; --accent-ink:#ffffff; --mat:#14213a; --mat-fg:#f2f5fb;
  --ok:#1f9d6b;
  --f-display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1220; --surface:#141d30; --fg:#e8edf7; --muted:#93a0b8;
  --line:#26324a; --accent:#ff8a33; --accent-ink:#1a0d02; --mat:#060b16; --mat-fg:#e8edf7; --ok:#3cc98f;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:800 1.25rem/1 var(--f-display);margin:0;letter-spacing:-.01em}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:600 .85rem var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.mat{background:var(--mat);color:var(--mat-fg);border-radius:28px;padding:22px 20px 20px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px)}
.mat::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 26px);opacity:.9}
.label{font:600 .72rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
#count{font:800 clamp(6rem,34vw,9.5rem)/.9 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.04em;transition:transform .12s}
#count.pop{transform:translateY(-10px) scale(1.04)}
#status{font:500 .85rem var(--f-mono);opacity:.8;min-height:1.3em;text-align:center}
#status.air{color:var(--accent);opacity:1}

.controls{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:16px;padding:16px;font:800 1.05rem var(--f-display);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);flex:0 0 auto;padding-inline:20px}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.card h2{font:600 .72rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between}
#trace{width:100%;height:110px;display:block}
.videowrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.videowrap video,.videowrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{image-rendering:pixelated;opacity:.75;mix-blend-mode:screen}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:500 1.15rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:.72rem;color:var(--muted)}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{font-weight:600}
.row small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
input[type=range]{width:46%;accent-color:var(--accent)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.err{color:#d33c3c;font-weight:600}
@media (prefers-reduced-motion:reduce){#count{transition:none}#count.pop{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Trampolin-Zähler</h1>
    <div class="seg" role="group" aria-label="Messart">
      <button id="m-motion" aria-pressed="true">Sensor</button>
      <button id="m-camera" aria-pressed="false">Kamera</button>
    </div>
  </header>

  <section class="mat" aria-live="polite">
    <div class="label">Sprünge</div>
    <div id="count">0</div>
    <div id="status">Bereit</div>
  </section>

  <div class="controls">
    <button class="btn primary" id="start">Start</button>
    <button class="btn ghost" id="reset">Zurücksetzen</button>
  </div>

  <section class="card" id="camcard" hidden>
    <h2>Kamerabild <span id="fps"></span></h2>
    <div class="videowrap">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay" width="80" height="60"></canvas>
    </div>
  </section>

  <section class="card">
    <h2><span id="tracetitle">Beschleunigung (g)</span><span id="tracevalue"></span></h2>
    <canvas id="trace"></canvas>
  </section>

  <div class="stats">
    <div class="stat"><b id="s-time">0:00</b><span>Dauer</span></div>
    <div class="stat"><b id="s-rate">–</b><span>Sprünge/min</span></div>
    <div class="stat"><b id="s-best">–</b><span id="s-best-l">Beste Flugzeit</span></div>
    <div class="stat"><b id="s-avg">–</b><span id="s-avg-l">Ø Flugzeit</span></div>
    <div class="stat"><b id="s-height">–</b><span>Max. Höhe</span></div>
    <div class="stat"><b id="s-last">–</b><span>Letzter Sprung</span></div>
  </div>

  <section class="card">
    <h2>Einstellungen</h2>
    <div class="row">
      <label for="sens">Empfindlichkeit<small id="sensinfo">Mittel</small></label>
      <input type="range" id="sens" min="1" max="10" value="5">
    </div>
    <div class="row">
      <label for="beep">Ton bei jedem Sprung</label>
      <input type="checkbox" id="beep" checked>
    </div>
    <div class="row">
      <label for="speak">Ansage alle 10 Sprünge</label>
      <input type="checkbox" id="speak" checked>
    </div>
    <p class="hint" id="hint"></p>
  </section>
</main>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const G = 9.81;
let mode = "motion", running = false, count = 0, t0 = 0;
let airtimes = [], lastJumpAt = 0, lastBeat = [];
let wakeLock = null, audioCtx = null, stream = null, rafId = 0;
const trace = [];             // {v, t}
const TRACE_LEN = 240;

// ---------- Einstellungen ----------
const load = (k, d) => { try { const v = localStorage.getItem("tz_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem("tz_" + k, JSON.stringify(v)); } catch {} };
$("sens").value = load("sens", 5); $("beep").checked = load("beep", true); $("speak").checked = load("speak", true);
["sens","beep","speak"].forEach(id => $(id).addEventListener("input", e => {
  save(id, e.target.type === "checkbox" ? e.target.checked : +e.target.value); updateSensInfo();
}));
const sens = () => +$("sens").value;      // 1..10
function updateSensInfo(){
  const s = sens();
  $("sensinfo").textContent = s <= 3 ? "Niedrig – nur deutliche Sprünge" : s >= 8 ? "Hoch – auch kleine Hüpfer" : "Mittel";
}
updateSensInfo();

// ---------- Feedback ----------
function beep(freq = 880){
  if (!$("beep").checked || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = freq; o.type = "triangle";
  g.gain.setValueAtTime(.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.35, audioCtx.currentTime + .01);
  g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .12);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .13);
}
function say(text){
  if (!$("speak").checked || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = "de-DE"; u.rate = 1.1;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function registerJump(airtime){
  const now = performance.now();
  if (now - lastJumpAt < 220) return;            // Doppelzählung vermeiden
  lastJumpAt = now; count++;
  lastBeat.push(now); if (lastBeat.length > 12) lastBeat.shift();
  if (airtime) airtimes.push(airtime);
  const c = $("count"); c.textContent = count; c.classList.add("pop");
  setTimeout(() => c.classList.remove("pop"), 120);
  if (count % 10 === 0) { beep(1320); say(String(count)); } else beep();
  updateStats();
}

// ---------- Statistik ----------
const fmtS = s => s.toFixed(2).replace(".", ",") + " s";
function updateStats(){
  const el = running ? (performance.now() - t0) / 1000 : (t0 ? (stopAt - t0) / 1000 : 0);
  $("s-time").textContent = Math.floor(el / 60) + ":" + String(Math.floor(el % 60)).padStart(2, "0");
  if (lastBeat.length >= 3) {
    const span = (lastBeat[lastBeat.length-1] - lastBeat[0]) / 1000;
    $("s-rate").textContent = Math.round((lastBeat.length - 1) / span * 60);
  } else $("s-rate").textContent = "–";
  if (airtimes.length) {
    const best = Math.max(...airtimes), avg = airtimes.reduce((a,b)=>a+b,0) / airtimes.length;
    $("s-best").textContent = fmtS(best);
    $("s-avg").textContent = fmtS(avg);
    $("s-height").textContent = Math.round(G * best * best / 8 * 100) + " cm";
    $("s-last").textContent = fmtS(airtimes[airtimes.length-1]);
  } else if (mode === "camera" && lastBeat.length >= 2) {
    $("s-last").textContent = fmtS((lastBeat[lastBeat.length-1] - lastBeat[lastBeat.length-2]) / 1000);
  }
}
let stopAt = 0;
setInterval(() => { if (running) updateStats(); }, 500);

// ---------- Signal-Plot ----------
const tc = $("trace"), tctx = tc.getContext("2d");
function sizeTrace(){ const r = devicePixelRatio || 1; tc.width = tc.clientWidth * r; tc.height = tc.clientHeight * r; }
addEventListener("resize", sizeTrace); sizeTrace();
function pushTrace(v){ trace.push(v); if (trace.length > TRACE_LEN) trace.shift(); }
function drawTrace(lines, lo, hi){
  const css = getComputedStyle(document.documentElement);
  const w = tc.width, h = tc.height, y = v => h - (v - lo) / (hi - lo) * h;
  tctx.clearRect(0, 0, w, h);
  tctx.lineWidth = 1 * devicePixelRatio; tctx.setLineDash([4*devicePixelRatio, 4*devicePixelRatio]);
  for (const [v, col] of lines){ tctx.strokeStyle = css.getPropertyValue(col); tctx.beginPath(); tctx.moveTo(0, y(v)); tctx.lineTo(w, y(v)); tctx.stroke(); }
  tctx.setLineDash([]);
  tctx.strokeStyle = css.getPropertyValue("--fg"); tctx.lineWidth = 2 * devicePixelRatio; tctx.beginPath();
  trace.forEach((v, i) => { const x = i / (TRACE_LEN - 1) * w; i ? tctx.lineTo(x, y(v)) : tctx.moveTo(x, y(v)); });
  tctx.stroke();
}

// ---------- Modus 1: Bewegungssensor ----------
// Im Flug ist das Handy im freien Fall (≈0 g), bei der Landung kommen 2–5 g.
let inAir = false, belowSince = 0, airStart = 0, lastMag = 1;
const freeTh = () => 0.25 + sens() * 0.03;     // 0,28 … 0,55 g
const landTh = () => 2.0 - sens() * 0.08;      // 1,92 … 1,2 g
function onMotion(e){
  const a = e.accelerationIncludingGravity; if (!a || a.x === null) return;
  const mag = Math.hypot(a.x, a.y, a.z) / G, now = performance.now();
  lastMag = mag; pushTrace(mag);
  if (!running) return;
  if (!inAir) {
    if (mag < freeTh()) {
      if (!belowSince) belowSince = now;
      if (now - belowSince > 70) { inAir = true; airStart = belowSince; setStatus("in der Luft", true); }
    } else belowSince = 0;
  } else {
    const t = (now - airStart) / 1000;
    if (mag > landTh()) {
      inAir = false; belowSince = 0; setStatus("Landung · " + fmtS(t));
      if (t > 0.15 && t < 3) registerJump(t);
    } else if (t > 3) { inAir = false; belowSince = 0; setStatus("Freier Fall zu lang – ignoriert"); }
  }
}
async function startMotion(){
  if (typeof DeviceMotionEvent === "undefined") throw new Error("Dieses Gerät liefert keine Bewegungsdaten.");
  if (typeof DeviceMotionEvent.requestPermission === "function") {
    const p = await DeviceMotionEvent.requestPermission();
    if (p !== "granted") throw new Error("Bewegungssensor nicht freigegeben. Erlaube „Bewegung & Ausrichtung“ in Safari.");
  }
  addEventListener("devicemotion", onMotion);
  const loop = () => { drawTrace([[freeTh(), "--accent"], [landTh(), "--ok"]], 0, 4); $("tracevalue").textContent = lastMag.toFixed(2).replace(".", ",") + " g"; rafId = requestAnimationFrame(loop); };
  loop();
}
function stopMotion(){ removeEventListener("devicemotion", onMotion); inAir = false; belowSince = 0; }

// ---------- Modus 2: Kamera ----------
// Bewegte Pixel per Bilddifferenz, deren mittlere Höhe wird verfolgt.
// Ein Sprung = Weg nach oben bis zum höchsten Punkt, dann wieder nach unten.
const W = 80, H = 60, work = document.createElement("canvas"); work.width = W; work.height = H;
const wctx = work.getContext("2d", { willReadFrequently: true });
const ov = $("overlay"), octx = ov.getContext("2d"), ovImg = octx.createImageData(W, H);
let prev = null, ySm = null, dir = 0, ext = 0, frames = 0, fpsT = 0, lastTop = 0;
async function startCamera(){
  if (!navigator.mediaDevices?.getUserMedia) throw new Error("Kamera nicht verfügbar. Die Seite muss über HTTPS laufen.");
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }, audio: false });
  const v = $("video"); v.srcObject = stream; await v.play();
  prev = null; ySm = null; dir = 0;
  const loop = () => { processFrame(v); rafId = requestAnimationFrame(loop); };
  loop();
}
function processFrame(v){
  if (v.readyState < 2) return;
  wctx.drawImage(v, 0, 0, W, H);
  const d = wctx.getImageData(0, 0, W, H).data, gray = new Uint8Array(W * H);
  for (let i = 0, j = 0; i < gray.length; i++, j += 4) gray[i] = (d[j] * 77 + d[j+1] * 150 + d[j+2] * 29) >> 8;
  const thr = 46 - sens() * 3;                 // 43 … 16 Graustufen
  let n = 0, sumY = 0;
  const o = ovImg.data;
  if (prev) for (let i = 0; i < gray.length; i++) {
    const moving = Math.abs(gray[i] - prev[i]) > thr;
    if (moving) { n++; sumY += (i / W) | 0; }
    const k = i * 4; o[k] = moving ? 255 : 0; o[k+1] = moving ? 122 : 0; o[k+2] = moving ? 26 : 0; o[k+3] = moving ? 255 : 0;
  }
  prev = gray; octx.putImageData(ovImg, 0, 0);
  frames++; const now = performance.now();
  if (now - fpsT > 1000) { $("fps").textContent = frames + " fps"; frames = 0; fpsT = now; }
  if (n > W * H * 0.004) {
    const y = sumY / n;
    ySm = ySm === null ? y : ySm + (y - ySm) * 0.45;
  }
  if (ySm === null) return;
  const height = H - ySm;                      // groß = oben
  pushTrace(height);
  const amp = 9 - sens() * 0.6;                // nötige Auf/Ab-Strecke in Zeilen
  drawTrace([], 0, H); $("tracevalue").textContent = "Höhe " + Math.round(height / H * 100) + " %";
  if (!running) return;
  if (dir >= 0) {                              // steigt oder unbekannt
    if (height > ext || dir === 0) ext = Math.max(ext, height);
    if (dir === 0) dir = 1;
    if (height < ext - amp) {                  // Scheitelpunkt überschritten
      if (now - lastTop > 300) { registerJump(0); lastTop = now; setStatus("Sprung erkannt"); }
      dir = -1; ext = height;
    }
  } else {
    ext = Math.min(ext, height);
    if (height > ext + amp) { dir = 1; ext = height; setStatus("steigt …", true); }
  }
}
function stopCamera(){ stream?.getTracks().forEach(t => t.stop()); stream = null; $("video").srcObject = null; $("fps").textContent = ""; }

// ---------- Steuerung ----------
function setStatus(t, air){ $("status").textContent = t; $("status").classList.toggle("air", !!air); }
function setHint(){
  $("hint").innerHTML = mode === "motion"
    ? "Handy fest am Körper tragen, zum Beispiel in einer engen Hosentasche oder einer Sportarmband-Halterung. Im Flug misst das Handy fast 0 g, bei der Landung ein Vielfaches davon. Daraus werden Flugzeit und Höhe berechnet."
    : "Handy seitlich vom Trampolin aufstellen, so dass der ganze Sprung im Bild ist. Ruhiger Hintergrund und gutes Licht helfen. Flugzeit und Höhe gibt es nur im Sensor-Modus.";
  $("tracetitle").textContent = mode === "motion" ? "Beschleunigung (g)" : "Bewegungshöhe im Bild";
  $("camcard").hidden = mode !== "camera";
  ["s-best","s-avg","s-height"].forEach(id => $(id).parentElement.style.opacity = mode === "camera" ? .45 : 1);
}
async function start(){
  try {
    if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    audioCtx?.resume();
    if ("speechSynthesis" in window && $("speak").checked) { const u = new SpeechSynthesisUtterance(""); speechSynthesis.speak(u); }  // iOS: Sprachausgabe per Tipp freischalten
    trace.length = 0;
    if (mode === "motion") await startMotion(); else await startCamera();
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
    running = true; if (!t0 || !count) t0 = performance.now();
    $("start").textContent = "Stopp"; setStatus(mode === "motion" ? "Los geht’s – spring!" : "Kamera läuft");
    $("m-motion").disabled = $("m-camera").disabled = true;
  } catch (e) { setStatus(""); $("hint").innerHTML = '<span class="err">' + (e.message || e) + "</span>"; stop(); }
}
function stop(){
  running = false; stopAt = performance.now(); cancelAnimationFrame(rafId);
  stopMotion(); stopCamera();
  try { wakeLock?.release(); } catch {} wakeLock = null;
  $("start").textContent = "Start"; $("m-motion").disabled = $("m-camera").disabled = false;
  if (count) { setStatus("Pausiert · " + count + " Sprünge"); save("last", { count, date: Date.now() }); }
  updateStats();
}
function reset(){
  count = 0; airtimes = []; lastBeat = []; t0 = running ? performance.now() : 0; lastJumpAt = 0;
  $("count").textContent = "0"; ["s-rate","s-best","s-avg","s-height","s-last"].forEach(id => $(id).textContent = "–");
  $("s-time").textContent = "0:00"; setStatus(running ? "Zurückgesetzt" : "Bereit");
}
function setMode(m){
  if (running) return; mode = m;
  $("m-motion").setAttribute("aria-pressed", m === "motion"); $("m-camera").setAttribute("aria-pressed", m === "camera");
  save("mode", m); reset(); setHint(); trace.length = 0; drawTrace([], 0, 1);
}
$("start").onclick = () => running ? stop() : start();
$("reset").onclick = reset;
$("m-motion").onclick = () => setMode("motion");
$("m-camera").onclick = () => setMode("camera");
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && running && !wakeLock) { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
});
setMode(load("mode", "motion"));
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
